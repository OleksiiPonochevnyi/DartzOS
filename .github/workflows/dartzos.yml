          mkdir -p "$(dirname "/tmp/grub.svg")"
          cat > "/tmp/grub.svg" <<'DZ_FIN'
          <svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
          <defs><radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0%" stop-color="#2A3350"/><stop offset="100%" stop-color="#0E1020"/></radialGradient></defs>
          <rect width="640" height="480" fill="#000000"/>
          <g transform="translate(205 60) scale(0.44921875)">
          @LOGO@
          </g>
          <text x="320" y="345" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="50" fill="#ffffff">DartzOS</text>
          </svg>
          DZ_FIN
          mkdir -p "$(dirname "/tmp/fondos.py")"
          cat > "/tmp/fondos.py" <<'DZ_FIN'
          #!/usr/bin/env python3
          # Genera los fondos de pantalla de DartzOS (luna, montanas, bosque, oceano, aurora)
          import random, math, sys, os
          OUT = sys.argv[1]; os.makedirs(OUT, exist_ok=True)
          W,H=2560,1600
          def stars(n,seed,ymax=1100,op=0.9):
              r=random.Random(seed); out=[]
              for _ in range(n):
                  x=r.uniform(0,W); y=r.uniform(0,ymax); s=r.choice([1.2,1.6,2.2,2.8,3.4]); o=r.uniform(0.3,op)
                  out.append('<circle cx="%.0f" cy="%.0f" r="%s" fill="#fff" opacity="%.2f"/>'%(x,y,s,o))
              return "".join(out)
          def ridge(seed,base,amp,step=80,rough=0.5):
              r=random.Random(seed); pts=[]
              for x in range(-100,W+200,step):
                  y=base+amp*math.sin(x/430+seed)+r.uniform(-amp*rough,amp*rough); pts.append("%d,%.0f"%(x,y))
              return "M-100,1700 L"+" L".join(pts)+" L%d,1700 Z"%(W+200)
          def lg(id,stops):
              return '<linearGradient id="%s" x1="0" y1="0" x2="0" y2="1">%s</linearGradient>'%(id,"".join('<stop offset="%s" stop-color="%s"/>'%(o,c) for o,c in stops))
          def svg(name,defs,body):
              open(os.path.join(OUT,name+".svg"),"w").write('<svg xmlns="http://www.w3.org/2000/svg" width="%d" height="%d" viewBox="0 0 %d %d"><defs>%s<radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>%s</svg>'%(W,H,W,H,defs,body))
          R='<rect width="%d" height="%d" fill="url(#c)"/>'%(W,H)
          # Luna
          b=R+stars(420,1)+'<circle cx="1820" cy="430" r="420" fill="url(#glow)"/><circle cx="1820" cy="430" r="190" fill="#f4f1e6"/><circle cx="1760" cy="380" r="34" fill="#e2ddcc"/><circle cx="1880" cy="500" r="48" fill="#e5e0cf"/><circle cx="1870" cy="360" r="20" fill="#e2ddcc"/><circle cx="1745" cy="500" r="16" fill="#e2ddcc"/>'
          b+='<path d="%s" fill="#14274a"/><path d="%s" fill="#0c1a33"/><path d="%s" fill="#060e1f"/>'%(ridge(3,1150,90,90,0.4),ridge(5,1300,70,70,0.5),ridge(8,1450,50,60,0.6))
          svg("luna",lg("c",[(0,"#050816"),(0.6,"#0d1b3d"),(1,"#1e3a6b")]),b)
          # Montanas
          b=R+'<circle cx="1280" cy="1020" r="520" fill="url(#glow)"/><circle cx="1280" cy="1020" r="170" fill="#ffe3b3"/>'
          for i,c in enumerate(["#a8487a","#7d3a72","#552b62","#36204d","#1d1433"]):
              b+='<path d="%s" fill="%s"/>'%(ridge(10+i,820+i*150,140-i*18,110-i*10,0.35),c)
          svg("montanas",lg("c",[(0,"#2b1b5a"),(0.45,"#c4507a"),(0.75,"#f39a6b"),(1,"#ffd59e")]),b)
          # Bosque
          b=R; r=random.Random(7)
          for col,base,sc in [("#6f9693",1000,0.9),("#4f7a74",1150,1.0),("#335c55",1300,1.15),("#1d3b35",1460,1.35)]:
              b+='<rect x="0" y="%d" width="%d" height="%d" fill="%s"/>'%(base,W,H-base,col); x=-60
              while x<W+60:
                  h=r.uniform(260,460)*sc; w=h*0.38
                  b+='<path d="M%.0f,%d L%.0f,%.0f L%.0f,%d Z" fill="%s"/>'%(x,base+20,x+w/2,base-h,x+w,base+20,col); x+=w*r.uniform(0.45,0.8)
          svg("bosque",lg("c",[(0,"#cfe3e8"),(1,"#7fa7a6")]),b)
          # Oceano
          b=R+'<circle cx="600" cy="420" r="300" fill="url(#glow)"/><circle cx="600" cy="420" r="110" fill="#fffbe8"/><rect x="0" y="900" width="%d" height="700" fill="#0a3d73"/>'%W
          for i,(col,yy,a) in enumerate([("#2aa3e0",930,26),("#1c7fc2",1050,34),("#155f9c",1200,42),("#0d4278",1380,50)]):
              b+='<path d="M-50,1700 L%s L%d,1700 Z" fill="%s"/>'%(" L".join("%d,%.0f"%(x,yy+a*math.sin(x/170+i)) for x in range(-50,W+60,40)),W+60,col)
          svg("oceano",lg("c",[(0,"#8fd3f4"),(0.55,"#d9f2fb"),(1,"#ffffff")]),b)
          # Aurora (azules y violeta, sin verde)
          b=R+stars(300,11,900,0.8)
          for i,(col,op) in enumerate([("#38bdf8",0.35),("#6366f1",0.25),("#a78bfa",0.18)]):
              pts=" ".join("%d,%.0f"%(x,420+i*90+160*math.sin(x/360+i*1.3)) for x in range(-100,W+200,60))
              b+='<polyline points="%s" fill="none" stroke="%s" stroke-width="%d" stroke-linecap="round" opacity="%s"/>'%(pts,col,220-i*40,op)
              b+='<polyline points="%s" fill="none" stroke="#fff" stroke-width="10" opacity="%.2f"/>'%(pts,op*0.6)
          b+='<path d="%s" fill="#04101a"/><path d="%s" fill="#020910"/>'%(ridge(21,1250,60,90,0.5),ridge(22,1420,40,60,0.6))
          svg("aurora",lg("c",[(0,"#020611"),(1,"#0b1d2b")]),b)
          DZ_FIN

          echo '🐶 Dibujando el perrito (logo, fondo, arranque)'
          D=config/includes.chroot/usr/share/dartzos
          P=config/includes.chroot/usr/share/plymouth/themes/dartzos
          LOGO="$D/logo.svg"
          for f in /tmp/fondo.svg /tmp/grub.svg; do
            python3 - "$f" "$LOGO" <<'PY'
          import sys
          f, logo = sys.argv[1], sys.argv[2]
          lines = open(logo).read().splitlines()
          i = next(n for n, l in enumerate(lines) if l.startswith('<svg'))
          body = "\n".join(lines[i+1:-1])
          s = open(f).read().replace("@LOGO@", body)
          open(f, "w").write(s)
          PY
          done
          rsvg-convert -w 128 "$LOGO" -o "$D/icono-128.png"
          rsvg-convert -w 400 "$LOGO" -o "$P/logo.png"
          rsvg-convert /tmp/fondo.svg -o "$D/fondo.png"
          mkdir -p config/includes.chroot/usr/share/backgrounds/dartzos
          python3 /tmp/fondos.py /tmp/fondos
          for f in /tmp/fondos/*.svg; do
            rsvg-convert "$f" -o "config/includes.chroot/usr/share/backgrounds/dartzos/$(basename "${f%.svg}").png"
          done
          convert -size 240x6 xc:'#f5f5f7' "$P/barra.png"
          chmod +x config/hooks/normal/*.hook.chroot config/includes.chroot/usr/local/bin/* config/includes.chroot/usr/local/sbin/*

          if [ -d /usr/share/live/build/bootloaders/grub-pc ]; then
            mkdir -p config/bootloaders
            cp -r /usr/share/live/build/bootloaders/grub-pc config/bootloaders/
            rsvg-convert /tmp/grub.svg -o config/bootloaders/grub-pc/splash.png
            grep -rlI "Live system" config/bootloaders/grub-pc 2>/dev/null | xargs -r sed -i 's/Live system/DartzOS/g' || true
            # Menu de arranque oculto: arranca directo (pulsando Esc al encender aparece)
            for f in config/bootloaders/grub-pc/*.cfg; do
              sed -i -E 's/^(\s*)set timeout=.*/\1set timeout=1\n\1set timeout_style=hidden/' "$f"
            done
            sed -i '1i set timeout_style=hidden\nset timeout=1' config/bootloaders/grub-pc/grub.cfg 2>/dev/null || true
            grep -rn "timeout" config/bootloaders/grub-pc/*.cfg || true
          fi

          echo '🐶 [4/5] Construyendo (20-40 minutos)'
          lb build 2>&1 | tee "$SALIDA/construccion.log" || true

          echo '🐶 [5/5] Resultado'
          ISO=$(ls "$B"/*.iso 2>/dev/null | head -1 || true)
          [ -n "$ISO" ] || { echo '❌ No se ha creado la ISO. Pasale construccion.log a Claude.'; exit 1; }
          cp "$ISO" "$SALIDA/DartzOS.iso"
          echo "✅ DartzOS listo: $(du -h "$SALIDA/DartzOS.iso" | cut -f1)"
          DARTZOS_SCRIPT_FIN
          sudo docker run --rm --privileged -v "$PWD/dartzos":/dartzos debian:trixie bash /dartzos/construir.sh

      - name: Descargar DartzOS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DartzOS
          path: dartzos/salida/DartzOS.iso
          compression-level: 0

      - name: Registro (por si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro
          path: dartzos/salida/construccion.log
          if-no-files-found: ignore
