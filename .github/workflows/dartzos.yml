          Comment=Forrest Gump en ASCII desde ascii.live
          Exec=xfce4-terminal --title=Forrest -x curl ascii.live/forrest
          Icon=dartzos
          Categories=Utility;
          DZ_FIN
          mkdir -p "$(dirname "config/includes.chroot/usr/share/applications/dartz-instalar.desktop")"
          cat > "config/includes.chroot/usr/share/applications/dartz-instalar.desktop" <<'DZ_FIN'
          [Desktop Entry]
          Type=Application
          Name=Instalar DartzOS
          Comment=Instala DartzOS en el disco de este ordenador
          Exec=/usr/local/bin/dartz-instalar
          Icon=dartzos
          Categories=System;
          DZ_FIN
          mkdir -p "$(dirname "config/includes.chroot/usr/share/dartzos/perro.txt")"
          cat > "config/includes.chroot/usr/share/dartzos/perro.txt" <<'DZ_FIN'
          $1    /\     ~~~     /\
          $1   /  \___________/  \
          $1   |    ^       ^    |
          $1   |      \(@)/      |
          $1 _  \      \_v_/      /  _
          $1(o)\ '-.___________.-' /(o)
          $1 \  \$2/~~~~~~~~~~~~~~~\$1/  /
          $1  \_$2|   .-~~~~~~~-.   |$1_/
          $2    |  (           )  |
          $2    |  (     .     )  |
          $1 _  $2\   '-._____.-'   /$1  _
          $1(o)--$2-'-._________.-'-$1--(o)
          $2            \_/
          DZ_FIN
          mkdir -p "$(dirname "config/includes.chroot/usr/share/plymouth/themes/dartzos/dartzos.plymouth")"
          cat > "config/includes.chroot/usr/share/plymouth/themes/dartzos/dartzos.plymouth" <<'DZ_FIN'
          [Plymouth Theme]
          Name=DartzOS
          Description=El perrito de DartzOS mientras arranca
          ModuleName=script

          [script]
          ImageDir=/usr/share/plymouth/themes/dartzos
          ScriptFile=/usr/share/plymouth/themes/dartzos/dartzos.script
          DZ_FIN
          mkdir -p "$(dirname "config/includes.chroot/usr/share/plymouth/themes/dartzos/dartzos.script")"
          cat > "config/includes.chroot/usr/share/plymouth/themes/dartzos/dartzos.script" <<'DZ_FIN'
          // Pantalla de arranque de DartzOS: el perrito y una barra de carga

          Window.SetBackgroundTopColor(0, 0, 0);
          Window.SetBackgroundBottomColor(0, 0, 0);

          logo.image = Image("logo.png");
          logo.sprite = Sprite(logo.image);
          logo.x = Window.GetX() + Window.GetWidth() / 2 - logo.image.GetWidth() / 2;
          logo.y = Window.GetY() + Window.GetHeight() / 2 - logo.image.GetHeight() / 2 - 40;
          logo.sprite.SetPosition(logo.x, logo.y, 0);

          titulo.image = Image.Text("DartzOS", 1, 1, 1);
          titulo.sprite = Sprite(titulo.image);
          titulo.sprite.SetPosition(Window.GetX() + Window.GetWidth() / 2 - titulo.image.GetWidth() / 2,
                                    logo.y + logo.image.GetHeight() + 20, 1);

          barra.image = Image("barra.png");
          barra.sprite = Sprite();
          barra.x = Window.GetX() + Window.GetWidth() / 2 - 120;
          barra.y = logo.y + logo.image.GetHeight() + 60;

          fun progreso(duracion, avance) {
            ancho = Math.Int(240 * avance);
            if (ancho < 1) ancho = 1;
            barra.sprite.SetImage(barra.image.Scale(ancho, 6));
            barra.sprite.SetPosition(barra.x, barra.y, 1);
          }
          Plymouth.SetBootProgressFunction(progreso);
          DZ_FIN
          mkdir -p "$(dirname "config/package-lists/dartzos.list.chroot")"
          cat > "config/package-lists/dartzos.list.chroot" <<'DZ_FIN'
          # ===== Paquetes de DartzOS =====

          # Sistema live (arrancar desde el USB)
          live-boot
          live-config
          live-config-systemd
          user-setup
          sudo
          locales
          console-setup
