          Icon=preferences-desktop-screensaver
          Categories=Utility;
          DZ_FIN
          mkdir -p "$(dirname "config/includes.chroot/usr/share/applications/dartz-chrome.desktop")"
          cat > "config/includes.chroot/usr/share/applications/dartz-chrome.desktop" <<'DZ_FIN'
          [Desktop Entry]
          Type=Application
          Name=Instalar Google Chrome
          Comment=Descarga Google Chrome de la web de Google
          Exec=xfce4-terminal --hold --title="Instalar Chrome" -x sudo /usr/local/sbin/dartz-instalar-chrome
          Icon=web-browser
          Categories=Network;
          DZ_FIN
          mkdir -p "$(dirname "config/includes.chroot/usr/share/applications/dartz-forrest.desktop")"
          cat > "config/includes.chroot/usr/share/applications/dartz-forrest.desktop" <<'DZ_FIN'
          [Desktop Entry]
          Type=Application
