          Icon=dartzos
          Categories=System;
          DZ_FIN
          mkdir -p "$(dirname "config/includes.chroot/usr/share/applications/dartz-cafe.desktop")"
          cat > "config/includes.chroot/usr/share/applications/dartz-cafe.desktop" <<'DZ_FIN'
