          mkdir -p "$(dirname "/tmp/fondo.svg")"
          cat > "/tmp/fondo.svg" <<'DZ_FIN'
          <svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
          <defs>
            <linearGradient id="cielo" x1="0" y1="0" x2="0.25" y2="1">
              <stop offset="0" stop-color="#060B1E"/><stop offset="0.6" stop-color="#0C1C44"/><stop offset="1" stop-color="#12306B"/>
            </linearGradient>
            <linearGradient id="ola1" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#173A8C"/><stop offset="1" stop-color="#2563EB"/>
            </linearGradient>
            <linearGradient id="ola2" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#1D6FE0"/><stop offset="0.6" stop-color="#2FA8F0"/><stop offset="1" stop-color="#5BC8F5"/>
            </linearGradient>
            <linearGradient id="ola3" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#9FDBFA"/><stop offset="0.5" stop-color="#E3F4FF"/><stop offset="1" stop-color="#FFFFFF"/>
            </linearGradient>
            <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
