          <path d="M-300 1200 C 520 1060 900 1320 1400 1200 S 2200 1040 2900 1150 L2900 1900 L-300 1900 Z" fill="url(#ola2)" opacity="0.92"/>
          <path d="M-300 1360 C 600 1240 1000 1460 1500 1360 S 2250 1230 2900 1320 L2900 1900 L-300 1900 Z" fill="url(#ola3)" opacity="0.95"/>
