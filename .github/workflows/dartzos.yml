          xfce4-pulseaudio-plugin
          xfce4-power-manager
          xfce4-screenshooter
          xfce4-taskmanager
          xfce4-notifyd
          lightdm
          lightdm-gtk-greeter
          greybird-gtk-theme
          elementary-xfce-icon-theme
          mousepad
          ristretto
          thunar-archive-plugin
          file-roller
          fonts-dejavu
          fonts-inter
          fonts-noto-color-emoji

          # Internet
          network-manager
          network-manager-gnome
          firefox-esr
          firefox-esr-l10n-es-es
